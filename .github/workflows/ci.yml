name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Run tests (async feature)
        run: cargo test -p deprader --features async --locked

  coverage:
    name: cargo llvm-cov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --locked
      - name: Upload Rust coverage
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: lcov.info
          if-no-files-found: error

  contract-wasm:
    name: Build contract (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          key: contract-wasm
      - name: Build deprader_router
        run: cargo build -p deprader-router --target wasm32v1-none --release --locked

  self-scan:
    name: scan own lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: self-scan
      - name: Build depradar
        run: cargo build --locked --bin depradar
      - name: Scan Cargo.lock and package-lock.json files
        run: |
          for lockfile in Cargo.lock client/package-lock.json frontend/package-lock.json; do
            ./target/debug/depradar --fail-on critical scan "$lockfile"
          done

  repo-sweep-smoke:
    name: encrypted repository sweep smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --bin depradar
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: bash tests/nightly_repo_sweep.sh

  client:
    name: client (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  nightly-ecosystem-sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Scan Drips Wave repositories (read-only, rate-limited)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWEEP_REPOS_FILE: .github/drips-wave-repos.txt
          SWEEP_OUTPUT_DIR: sweep-report
          SWEEP_RATE_LIMIT_MS: '1000'
        run: npm run sweep:ecosystem
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run smoke test against testnet
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ecosystem-sweep-report
          path: sweep-report/
          retention-days: 30
          if-no-files-found: warn
