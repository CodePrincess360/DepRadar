name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  nightly-ecosystem-sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Scan Drips Wave repositories (read-only, rate-limited)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWEEP_REPOS_FILE: .github/drips-wave-repos.txt
          SWEEP_OUTPUT_DIR: sweep-report
          SWEEP_RATE_LIMIT_MS: '1000'
        run: npm run sweep:ecosystem
      - name: Upload private report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ecosystem-sweep-report
          path: sweep-report/
          retention-days: 30
          if-no-files-found: warn
