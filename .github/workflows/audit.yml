name: Dependency Audit

on:
  schedule:
    - cron: "0 6 * * 1"
    # Nightly ecosystem sweep (issue #310)
    - cron: "0 3 * * *"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "client/package.json"
      - "client/package-lock.json"
      - "frontend/package.json"
      - "frontend/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  npm-audit:
    name: npm audit (client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

  npm-audit-frontend:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

  ecosystem-sweep:
    name: nightly ecosystem sweep
    runs-on: ubuntu-latest
    # Read-only scan of a published list of Drips Wave repositories.
    # Results are uploaded as a private artifact for coordinated disclosure.
    steps:
      - uses: actions/checkout@v4
      - name: Scan Drips Wave repositories (read-only, rate-limited)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_LIST: .github/drips-wave-repos.txt
          RATE_LIMIT_SECONDS: "2"
        run: |
          set -euo pipefail
          mkdir -p ecosystem-report
          report="ecosystem-report/sweep-$(date -u +%Y%m%d).json"
          echo '{"generated_at":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","repos":[]}' > "$report"
          if [ -f "$REPO_LIST" ]; then
            while IFS= read -r repo; do
              [ -z "$repo" ] && continue
              case "$repo" in \#*) continue ;; esac
              echo "Scanning $repo (read-only)"
              curl -sS -f \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$repo/dependency-graph/sbom" \
                -o "ecosystem-report/$(echo "$repo" | tr '/' '_').sbom.json" \
                || echo "warn: failed to fetch $repo"
              sleep "$RATE_LIMIT_SECONDS"
            done < "$REPO_LIST"
          else
            echo "No repo list found at $REPO_LIST; skipping"
          fi
      - name: Upload private report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-sweep-report
          path: ecosystem-report/
          retention-days: 30
          if-no-files-found: warn
